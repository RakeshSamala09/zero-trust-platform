apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zero-trust-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/RakeshSamala09/zero-trust-platform.git
    targetRevision: main
    path: argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
