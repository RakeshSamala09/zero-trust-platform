apiVersion: apps/v1
kind: Deployment
metadata:
  name: samala-database
  labels:
    app: samala-database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: samala-database
  template:
    metadata:
      labels:
        app: samala-database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: samala-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: samala-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: samala-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "samala_user"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "samala_user"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: samala-database-pvc
        - name: init-script
          configMap:
            name: samala-db-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samala-database-pvc
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName omitted -> uses cluster default.
  # Your repo already has platform/storage/ebs-storageclass.yaml — set that
  # storageClassName explicitly here if it isn't the cluster default.
  resources:
    requests:
      storage: 5Gi
