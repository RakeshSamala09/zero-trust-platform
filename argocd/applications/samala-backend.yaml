apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: samala-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: https://github.com/RakeshSamala09/zero-trust-platform.git
    targetRevision: main
    path: apps/samala-backend/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: samala-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
