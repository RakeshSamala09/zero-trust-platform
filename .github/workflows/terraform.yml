name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      my_ip_cidr:
        description: 'Your current public IP in CIDR form (e.g. 49.207.115.42/32). Leave blank to use the saved MY_IP_CIDR secret instead.'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write   # needed to comment plan output on PRs
  id-token: write         # needed if you use OIDC to auth to cloud provider

env:
  TF_WORKING_DIR: "terraform"   # your .tf files live in the /terraform subfolder
  TF_VERSION: "1.9.5"
  AWS_REGION: "ap-south-1"       # matches your variable.tf default
  # Use the manual input if this run was triggered via workflow_dispatch with a value,
  # otherwise fall back to the MY_IP_CIDR secret (used for push/PR-triggered runs).
  TF_VAR_my_ip_cidr: ${{ github.event.inputs.my_ip_cidr != '' && github.event.inputs.my_ip_cidr || secrets.MY_IP_CIDR }}
  TF_VAR_key_pair_name: ${{ secrets.KEY_PAIR_NAME }}

jobs:
  # ---------------------------------------------------------------------
  # 1. Validate + Plan -> runs on every push and every PR into main
  # ---------------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # Better long-term: switch to OIDC (no static keys) —
          # role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/<GHA_ROLE>

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
          FMT_OUTCOME: "${{ steps.fmt.outcome }}"
          VALIDATE_OUTCOME: "${{ steps.validate.outcome }}"
        with:
          script: |
            const output = `#### Terraform Format 🖌 \`${process.env.FMT_OUTCOME}\`
            #### Terraform Validate 🤖 \`${process.env.VALIDATE_OUTCOME}\`
            #### Terraform Plan 📖
            \`\`\`
            ${process.env.PLAN}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------
  # 2. Apply -> runs ONLY after a push (merge) to main, and PAUSES
  #    for manual approval because it targets the "production" environment
  #    which you configure with required reviewers in repo settings.
  # ---------------------------------------------------------------------
  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production   # <-- this is what triggers the manual approval gate
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/<GHA_ROLE>

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan