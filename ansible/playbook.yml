---
# Zero Trust Platform — Cluster Bootstrap
# Run after `terraform apply` has created fresh EC2 instances.
# Usage: ansible-playbook playbook.yml

- name: Initialize Kubernetes control plane on master
  hosts: master
  become: true
  vars_files:
    - vars.yml
  tasks:
    - name: Wait for bootstrap user_data script to finish
      wait_for:
        path: /var/log/bootstrap-done.log
        state: present
        timeout: 300

    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Run kubeadm init
      command: >
        kubeadm init
        --pod-network-cidr={{ kube_pod_network_cidr }}
        --apiserver-cert-extra-sans={{ ansible_host }}
      when: not admin_conf.stat.exists
      register: kubeadm_init_result

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin.conf to ubuntu user's kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Install Calico CNI
      become_user: ubuntu
      command: kubectl apply -f {{ calico_manifest_url }}
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      changed_when: true

    - name: Generate fresh kubeadm join command
      command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Save join command to local controller for the workers play
      copy:
        content: "{{ join_command_raw.stdout }}"
        dest: "{{ playbook_dir }}/.join-command.sh"
      delegate_to: localhost
      become: false

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  tasks:
    - name: Check if node already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Read join command from controller
      set_fact:
        join_command: "{{ lookup('file', playbook_dir + '/.join-command.sh') }}"

    - name: Run kubeadm join
      command: "{{ join_command }}"
      when: not kubelet_conf.stat.exists

- name: Confirm all nodes are ready
  hosts: master
  become: true
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Wait for all nodes to report Ready
      command: kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'
      register: node_status
      until: "'False' not in node_status.stdout"
      retries: 20
      delay: 15

- name: Install ArgoCD
  hosts: master
  become: true
  become_user: ubuntu
  vars_files:
    - vars.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Create argocd namespace
      command: kubectl create namespace argocd
      register: ns_result
      failed_when: ns_result.rc != 0 and 'AlreadyExists' not in ns_result.stderr
      changed_when: "'created' in ns_result.stdout"

    - name: Apply ArgoCD manifests
      command: kubectl apply --server-side --force-conflicts -n argocd -f {{ argocd_manifest_url }}
      changed_when: true

    - name: Wait for ArgoCD server deployment to be available
      command: kubectl rollout status deployment/argocd-server -n argocd --timeout=180s
      changed_when: false

    - name: Expose ArgoCD server via NodePort
      command: >
        kubectl patch svc argocd-server -n argocd
        -p '{"spec": {"type": "NodePort"}}'
      changed_when: true

    - name: Retrieve ArgoCD initial admin password
      command: >
        kubectl -n argocd get secret argocd-initial-admin-secret
        -o jsonpath="{.data.password}"
      register: argocd_password_b64
      changed_when: false

    - name: Show ArgoCD admin password (decoded)
      debug:
        msg: "ArgoCD admin password: {{ argocd_password_b64.stdout | b64decode }}"

    - name: Get ArgoCD NodePort
      command: >
        kubectl get svc argocd-server -n argocd
        -o jsonpath='{.spec.ports[?(@.port==443)].nodePort}'
      register: argocd_nodeport
      changed_when: false

    - name: Show ArgoCD access URL
      debug:
        msg: "ArgoCD UI: https://{{ ansible_host }}:{{ argocd_nodeport.stdout }}"

- name: Create ECR pull secret and deploy sample app
  hosts: master
  become: true
  become_user: ubuntu
  vars_files:
    - vars.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Clone/update the application repo
      git:
        repo: "{{ github_repo_url }}"
        dest: /home/ubuntu/zero-trust-platform
        version: main
        force: true

    - name: Check if AWS CLI is installed
      command: which aws
      register: aws_cli_check
      failed_when: false
      changed_when: false

    - name: Ensure unzip is installed
      become_user: root
      apt:
        name: unzip
        state: present
        update_cache: true
      when: aws_cli_check.rc != 0

    - name: Install AWS CLI v2
      become_user: root
      shell: |
        cd /tmp
        curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q -o awscliv2.zip
        ./aws/install
      when: aws_cli_check.rc != 0

    - name: Get ECR login password
      command: aws ecr get-login-password --region {{ aws_region }}
      register: ecr_password
      changed_when: false

    - name: Create/update ECR pull secret
      command: >
        kubectl create secret docker-registry ecr-pull-secret
        --docker-server={{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com
        --docker-username=AWS
        --docker-password={{ ecr_password.stdout }}
        -n default
        --dry-run=client -o yaml
      register: secret_manifest
      changed_when: false

    - name: Apply the ECR pull secret
      shell: |
        echo '{{ secret_manifest.stdout }}' | kubectl apply -f -
      changed_when: true

    - name: Apply the ArgoCD Application for the sample app
      command: kubectl apply -f /home/ubuntu/zero-trust-platform/argocd-application.yml
      changed_when: true

- name: Install Istio service mesh
  hosts: master
  become: true
  become_user: ubuntu
  vars_files:
    - vars.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Check if istioctl is already downloaded
      stat:
        path: "/home/ubuntu/istio-{{ istio_version }}/bin/istioctl"
      register: istioctl_bin

    - name: Download Istio
      shell: |
        cd /home/ubuntu && curl -L https://istio.io/downloadIstio | ISTIO_VERSION={{ istio_version }} sh -
      when: not istioctl_bin.stat.exists

    - name: Install Istio (demo profile)
      command: "/home/ubuntu/istio-{{ istio_version }}/bin/istioctl install --set profile=demo -y"
      changed_when: true

    - name: Enable sidecar injection on default namespace
      command: kubectl label namespace default istio-injection=enabled --overwrite
      changed_when: true

    - name: Restart sample-app to pick up sidecar
      command: kubectl rollout restart deployment sample-app -n default
      changed_when: true
      failed_when: false  # ok if sample-app isn't deployed yet on first run

    - name: Apply strict mTLS PeerAuthentication
      copy:
        dest: /home/ubuntu/strict-mtls.yaml
        content: |
          apiVersion: security.istio.io/v1beta1
          kind: PeerAuthentication
          metadata:
            name: default
            namespace: istio-system
          spec:
            mtls:
              mode: STRICT

    - name: Apply the PeerAuthentication policy
      command: kubectl apply -f /home/ubuntu/strict-mtls.yaml
      changed_when: true

- name: Install OPA Gatekeeper and policies
  hosts: master
  become: true
  become_user: ubuntu
  vars_files:
    - vars.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Apply Gatekeeper manifests
      command: kubectl apply -f {{ gatekeeper_manifest_url }}
      changed_when: true

    - name: Wait for Gatekeeper controller to be ready
      command: kubectl rollout status deployment/gatekeeper-controller-manager -n gatekeeper-system --timeout=120s
      changed_when: false

    - name: Apply custom Gatekeeper ConstraintTemplate (block privileged containers)
      command: kubectl apply -f /home/ubuntu/zero-trust-platform/gatekeeper/Constrainttemplateprivileged.yaml
      changed_when: true

    - name: Apply the Constraint enforcing the policy
      command: kubectl apply -f /home/ubuntu/zero-trust-platform/gatekeeper/Constraintprivileged.yaml
      changed_when: true

- name: Label the dedicated monitoring node
  hosts: monitoring
  become: true
  tasks:
    - name: Label node for monitoring workloads
      become_user: ubuntu
      delegate_to: "{{ groups['master'][0] }}"
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      command: kubectl label node {{ ansible_hostname }} workload=monitoring --overwrite
      changed_when: true

- name: Install Prometheus, Grafana, and Istio metric integration
  hosts: master
  become: true
  become_user: ubuntu
  vars_files:
    - vars.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Check if Helm is already installed
      command: which helm
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Install Helm
      shell: |
        curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      become_user: root
      when: helm_check.rc != 0

    - name: Add prometheus-community Helm repo
      command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: repo_add_result
      failed_when: false
      changed_when: "'has been added' in repo_add_result.stdout"

    - name: Update Helm repos
      command: helm repo update
      changed_when: true

    - name: Check if monitoring stack is already installed
      command: helm list -n {{ monitoring_namespace }} -o json
      register: helm_list_result
      changed_when: false

    - name: Install kube-prometheus-stack
      command: >
        helm install {{ monitoring_release_name }} prometheus-community/kube-prometheus-stack
        --namespace {{ monitoring_namespace }}
        --create-namespace
        --set prometheus.prometheusSpec.nodeSelector.workload=monitoring
        --set grafana.nodeSelector.workload=monitoring
        --set alertmanager.alertmanagerSpec.nodeSelector.workload=monitoring
      when: monitoring_release_name not in helm_list_result.stdout
      changed_when: true

    - name: Wait for Grafana deployment to be available
      command: kubectl rollout status deployment/{{ monitoring_release_name }}-grafana -n {{ monitoring_namespace }} --timeout=180s
      changed_when: false

    - name: Expose Grafana via NodePort
      command: >
        kubectl patch svc {{ monitoring_release_name }}-grafana -n {{ monitoring_namespace }}
        -p '{"spec": {"type": "NodePort"}}'
      changed_when: true

    - name: Retrieve Grafana admin password
      command: >
        kubectl get secret {{ monitoring_release_name }}-grafana -n {{ monitoring_namespace }}
        -o jsonpath="{.data.admin-password}"
      register: grafana_password_b64
      changed_when: false

    - name: Show Grafana admin password (decoded)
      debug:
        msg: "Grafana admin password: {{ grafana_password_b64.stdout | b64decode }}"

    - name: Get Grafana NodePort
      command: >
        kubectl get svc {{ monitoring_release_name }}-grafana -n {{ monitoring_namespace }}
        -o jsonpath='{.spec.ports[?(@.port==80)].nodePort}'
      register: grafana_nodeport
      changed_when: false

    - name: Show Grafana access URL
      debug:
        msg: "Grafana UI: http://{{ ansible_host }}:{{ grafana_nodeport.stdout }} (username: admin)"

    - name: Ensure app repo is up to date
      git:
        repo: "{{ github_repo_url }}"
        dest: /home/ubuntu/zero-trust-platform
        version: main
        force: true

    - name: Apply Istio ServiceMonitor and PodMonitor for mesh metrics
      command: kubectl apply -f /home/ubuntu/zero-trust-platform/monitoring/istio-servicemonitor.yaml
      changed_when: true

- name: Label the dedicated logging node
  hosts: logging
  become: true
  tasks:
    - name: Label node for logging workloads
      become_user: ubuntu
      delegate_to: "{{ groups['master'][0] }}"
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      command: kubectl label node {{ ansible_hostname }} workload=logging --overwrite
      changed_when: true

- name: Install EBS CSI driver and StorageClass
  hosts: master
  become: true
  become_user: ubuntu
  vars_files:
    - vars.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Add aws-ebs-csi-driver Helm repo
      command: helm repo add aws-ebs-csi-driver https://kubernetes-sigs.github.io/aws-ebs-csi-driver
      register: repo_add_result
      failed_when: false
      changed_when: "'has been added' in repo_add_result.stdout"

    - name: Update Helm repos
      command: helm repo update
      changed_when: true

    - name: Check if EBS CSI driver is already installed
      command: helm list -n kube-system -o json
      register: helm_list_kube_system
      changed_when: false

    - name: Install AWS EBS CSI driver
      command: helm install aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver --namespace kube-system
      when: "'aws-ebs-csi-driver' not in helm_list_kube_system.stdout"
      changed_when: true

    - name: Wait for EBS CSI controller to be ready
      command: kubectl rollout status deployment/ebs-csi-controller -n kube-system --timeout=180s
      changed_when: false

    - name: Apply EBS StorageClass
      copy:
        dest: /home/ubuntu/ebs-storageclass.yaml
        content: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: ebs-gp3
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: ebs.csi.aws.com
          volumeBindingMode: WaitForFirstConsumer
          parameters:
            type: gp3
          reclaimPolicy: Delete

    - name: Apply the StorageClass to the cluster
      command: kubectl apply -f /home/ubuntu/ebs-storageclass.yaml
      changed_when: true

- name: Install ELK stack with persistent storage
  hosts: master
  become: true
  become_user: ubuntu
  vars_files:
    - vars.yml
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  tasks:
    - name: Add elastic Helm repo
      command: helm repo add elastic https://helm.elastic.co
      register: elastic_repo_result
      failed_when: false
      changed_when: "'has been added' in elastic_repo_result.stdout"

    - name: Add fluent Helm repo
      command: helm repo add fluent https://fluent.github.io/helm-charts
      register: fluent_repo_result
      failed_when: false
      changed_when: "'has been added' in fluent_repo_result.stdout"

    - name: Update Helm repos
      command: helm repo update
      changed_when: true

    - name: Check if Elasticsearch is already installed
      command: helm list -n {{ monitoring_namespace }} -o json
      register: helm_list_logging
      changed_when: false

    - name: Install Elasticsearch with persistent storage
      command: >
        helm install elasticsearch elastic/elasticsearch
        --namespace {{ monitoring_namespace }}
        --set replicas=1
        --set minimumMasterNodes=1
        --set resources.requests.cpu=200m
        --set resources.requests.memory=1Gi
        --set resources.limits.memory=2Gi
        --set nodeSelector.workload=logging
        --set volumeClaimTemplate.storageClassName=ebs-gp3
        --set volumeClaimTemplate.resources.requests.storage=10Gi
      when: "'\"name\":\"elasticsearch\"' not in helm_list_logging.stdout"
      changed_when: true

    - name: Wait for Elasticsearch to be ready
      command: kubectl wait --for=condition=Ready pod/elasticsearch-master-0 -n {{ monitoring_namespace }} --timeout=300s
      changed_when: false

    - name: Retrieve Elasticsearch password
      command: >
        kubectl get secrets --namespace {{ monitoring_namespace }} elasticsearch-master-credentials
        -o jsonpath="{.data.password}"
      register: es_password_b64
      changed_when: false

    - name: Set decoded ES password as a fact
      set_fact:
        es_password: "{{ es_password_b64.stdout | b64decode }}"

    - name: Show Elasticsearch password
      debug:
        msg: "Elasticsearch 'elastic' user password: {{ es_password }}"

    - name: Install Kibana
      command: >
        helm install kibana elastic/kibana
        --namespace {{ monitoring_namespace }}
        --set nodeSelector.workload=logging
      when: "'\"name\":\"kibana\"' not in helm_list_logging.stdout"
      changed_when: true
      register: kibana_install_result
      failed_when: false

    - name: Get Kibana NodePort
      command: >
        kubectl get svc kibana-kibana -n {{ monitoring_namespace }}
        -o jsonpath='{.spec.ports[?(@.port==5601)].nodePort}'
      register: kibana_nodeport
      changed_when: false
      failed_when: false

    - name: Expose Kibana via NodePort
      command: >
        kubectl patch svc kibana-kibana -n {{ monitoring_namespace }}
        -p '{"spec": {"type": "NodePort"}}'
      changed_when: true
      failed_when: false

    - name: Write Fluent Bit output config
      copy:
        dest: /home/ubuntu/fluent-bit-values.yaml
        content: |
          config:
            outputs: |
              [OUTPUT]
                  Name                  es
                  Match                 *
                  Host                  elasticsearch-master
                  Port                  9200
                  HTTP_User             elastic
                  HTTP_Passwd           {{ es_password }}
                  tls                   On
                  tls.verify            Off
                  Suppress_Type_Name    On

    - name: Install Fluent Bit
      command: >
        helm install fluent-bit fluent/fluent-bit
        --namespace {{ monitoring_namespace }}
        -f /home/ubuntu/fluent-bit-values.yaml
      when: "'\"name\":\"fluent-bit\"' not in helm_list_logging.stdout"
      changed_when: true

    - name: Show Kibana access URL
      debug:
        msg: "Kibana UI: http://{{ ansible_host }}:{{ kibana_nodeport.stdout }} (username: elastic)"
