name: samala-backend-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/samala-backend/**"
      - ".github/workflows/samala-backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/samala-backend/**"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: samala-backend
  WORKDIR: apps/samala-backend

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: ${{ env.WORKDIR }}
          args: >
            -Dsonar.organization=rakeshsamala09
            -Dsonar.projectKey=samala-backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ${{ env.WORKDIR }}/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "samala-backend"
          path: ${{ env.WORKDIR }}
          format: "HTML"
          out: "reports"
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports

  build-scan-push:
    name: Build, Trivy Scan, Push to ECR
    runs-on: ubuntu-latest
    needs: [sonarqube, owasp-dependency-check]
    permissions:
      id-token: write
      contents: read
      security-events: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ${{ env.WORKDIR }}
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
                        -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ${{ env.WORKDIR }}/.trivyignore

      - name: Trivy scan (SARIF for GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Output image URI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Pushed: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------
  # Deploy — runs the Ansible playbook against the master node,
  # pulling this exact image tag from ECR and rolling it out.
  # Only runs on main branch push (never on PRs).
  # -------------------------------------------------------------------
  deploy:
    name: Deploy via Ansible
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible + AWS CLI
        run: |
          pip install --quiet ansible boto3

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/samala-key.pem
          chmod 600 ~/.ssh/samala-key.pem

      - name: Write inventory file
        run: |
          mkdir -p ansible
          echo "${{ secrets.ANSIBLE_INVENTORY }}" > ansible/inventory.ini

      - name: Run deploy-samala.yml (backend only)
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.ini deploy-samala.yml \
            --tags backend \
            --extra-vars "backend_image_tag=${{ github.sha }}" \
            --private-key ~/.ssh/samala-key.pem
