apiVersion: v1
kind: ConfigMap
metadata:
  name: samala-config
data:
  DB_HOST: "samala-database"
  DB_PORT: "5432"
  DB_NAME: "samala_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: samala-secrets
type: Opaque
# NOTE: placeholder values for local/dev. Your repo already has an
# external-secrets pattern under platform/ (or add one) — wire this to
# AWS Secrets Manager before this touches anything real.
stringData:
  DB_USER: "samala_user"
  DB_PASSWORD: "samala_pass"
  JWT_SECRET: "change-me-in-production"
