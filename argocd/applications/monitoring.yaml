apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-rules
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RakeshSamala09/zero-trust-platform.git
    targetRevision: main
    path: platform/monitoring/prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
